<!DOCTYPE html>
<html lang="es" data-palette="cielo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TransportArte</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.85em%22 font-size=%2290%22>🚌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --radius: 14px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-palette="cielo"] {
    --bg: #eef5fb;
    --surface: #ffffff;
    --surface-2: #e1edf7;
    --text: #1c2b3a;
    --muted: #64798d;
    --border: #d3e2ee;
    --primary: #2f7dd6;
    --primary-dark: #1f5fac;
    --success: #1f9d55;
    --success-bg: #e5f7ea;
    --warning: #b7791f;
    --warning-bg: #fdf3dd;
    --danger: #d92d20;
    --danger-bg: #fde8e6;
  }
  /* Modo oscuro: por preferencia del sistema, o forzado a mano con el botón
     ☀️/🌙 (guardado en localStorage vía data-theme). Un data-theme explícito
     siempre gana por encima de lo que diga el sistema operativo. */
  :root[data-palette="cielo"][data-theme="dark"] {
    --bg: #0f1720;
    --surface: #16212c;
    --surface-2: #1e2b38;
    --text: #e7eef5;
    --muted: #93a6b8;
    --border: #2a3a4a;
    --primary: #5b9be8;
    --primary-dark: #3f7dd0;
    --success: #34c471;
    --success-bg: #113322;
    --warning: #e0ac48;
    --warning-bg: #3a2c0c;
    --danger: #f16a5e;
    --danger-bg: #3a1613;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-palette="cielo"]:not([data-theme="light"]) {
      --bg: #0f1720;
      --surface: #16212c;
      --surface-2: #1e2b38;
      --text: #e7eef5;
      --muted: #93a6b8;
      --border: #2a3a4a;
      --primary: #5b9be8;
      --primary-dark: #3f7dd0;
      --success: #34c471;
      --success-bg: #113322;
      --warning: #e0ac48;
      --warning-bg: #3a2c0c;
      --danger: #f16a5e;
      --danger-bg: #3a1613;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    overscroll-behavior-y: contain;
    -webkit-text-size-adjust: 100%;
  }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  button { font-family: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  input, select, textarea { font-family: inherit; font-size: 16px; }

  #mapContainer { position: fixed; inset: 0; z-index: 0; background: var(--surface-2); }
  /* El basemap con calles (Esri World Street Map, sin API key) no tiene una
     variante oscura gratis: en modo oscuro invertimos sus colores con un
     filtro CSS en vez de pedir tiles que no existen. */
  :root[data-theme="dark"] #mapContainer .leaflet-tile-pane {
    filter: invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.95) saturate(0.85);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) #mapContainer .leaflet-tile-pane {
      filter: invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.95) saturate(0.85);
    }
  }

  .brand-tiny {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    left: 14px;
    z-index: 25;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
    background: var(--surface);
    padding: 6px 12px;
    border-radius: 999px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  }
  .theme-toggle-btn {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: 12px;
    z-index: 32;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sheet-hint {
    margin: 2px 2px 0;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--muted);
  }

  .field { position: relative; margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .field input[type=text] {
    width: 100%;
    padding: 10px 11px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
  }
  .field input[type=text].armed { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(47,125,214,0.22); }
  .locate-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--primary-dark);
    padding: 6px 11px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    margin: -4px 0 12px;
  }
  .locate-btn:disabled { opacity: 0.6; cursor: default; }
  .btn {
    border: none;
    padding: 11px 14px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 12px -3px var(--primary-dark); }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-full { width: 100%; padding: 13px; font-size: 15px; border-radius: 13px; }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  .suggest-list {
    position: absolute;
    left: 0; right: 0; top: 100%;
    margin-top: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    z-index: 5;
    max-height: 200px;
    overflow-y: auto;
  }
  .suggest-list button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    border: none;
    background: transparent;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
  }
  .suggest-list button + button { border-top: 1px solid var(--border); }
  .suggest-list button:hover, .suggest-list button:active { background: var(--surface-2); }
  .suggest-loading { padding: 10px 12px; font-size: 12.5px; color: var(--muted); }

  .bottom-card {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 35;
    max-width: 560px;
    margin: 0 auto;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -6px 24px rgba(0,0,0,0.2);
    padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    max-height: 78vh;
    display: flex;
    flex-direction: column;
  }
  .sheet-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    background: var(--surface-2);
    border: none;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
    margin-bottom: 8px;
  }
  .sheet-summary span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet-chevron {
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--primary);
    font-size: 11.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    flex-shrink: 0;
  }
  .sheet-chevron .arrow { font-size: 15px; line-height: 1; }
  #sheetBody { flex-shrink: 0; padding-bottom: 4px; }

  .search-btn {
    display: block;
    width: 100%;
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 15px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 16px -3px var(--primary-dark);
    flex-shrink: 0;
    margin-top: 10px;
  }
  .search-btn:disabled { opacity: 0.6; cursor: default; }

  #resultsArea { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  #resultsArea:not(:empty) { margin-bottom: 4px; }

  .section-title {
    font-size: 12.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 4px 0 8px;
  }
  .transit-loading { color: var(--muted); font-size: 13px; text-align: center; padding: 16px; }
  .empty-hint { color: var(--muted); font-size: 13px; text-align: center; padding: 14px 4px; }

  .card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 10px;
  }

  .transit-result { display: flex; flex-direction: column; gap: 8px; }
  .arrival {
    padding: 12px 12px;
    border-radius: 13px;
    background: var(--surface-2);
    cursor: pointer;
  }
  .arrival.convenient { background: var(--success-bg); }
  .journey-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 8px; }
  .journey-head .journey-when { font-size: 13px; font-weight: 700; color: var(--success); white-space: nowrap; }
  .journey-step { display: flex; gap: 8px; padding: 5px 0; }
  .journey-step + .journey-step { border-top: 1px dashed var(--border); }
  .step-tag {
    flex-shrink: 0;
    font-size: 9.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 3px 8px;
    border-radius: 999px;
    height: fit-content;
    margin-top: 1px;
    background: var(--primary);
    color: #fff;
    width: 46px;
    text-align: center;
  }
  .step-tag.alight { background: var(--text); opacity: 0.75; }
  .step-tag.walk { background: var(--warning); width: 60px; }
  .step-body { flex: 1; min-width: 0; }
  .step-route { font-size: 13px; font-weight: 700; }
  .step-place { font-size: 12.5px; color: var(--text); }
  .step-place .link-btn { font-size: 11.5px; margin-left: 4px; white-space: nowrap; }
  .step-time { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .link-btn { color: var(--primary); text-decoration: none; font-weight: 700; }

  .toast {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 13px;
    z-index: 80;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    max-width: 85vw;
    text-align: center;
  }

  .my-location-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--primary);
    border: 3px solid #fff;
    box-shadow: 0 0 0 6px rgba(47,125,214,0.25), 0 2px 8px rgba(0,0,0,0.35);
    animation: locationPulse 2.2s ease-out infinite;
  }
  @keyframes locationPulse {
    0% { box-shadow: 0 0 0 4px rgba(47,125,214,0.35), 0 2px 8px rgba(0,0,0,0.35); }
    100% { box-shadow: 0 0 0 12px rgba(47,125,214,0), 0 2px 8px rgba(0,0,0,0.35); }
  }

  .stop-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--surface);
    border: 3px solid var(--primary);
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  .stop-popup { font-size: 12.5px; min-width: 180px; }
  .stop-popup .stop-popup-title { font-weight: 700; font-size: 13px; margin: 0 0 6px; }
  .stop-popup .arrival { padding: 8px 9px; }
  .leaflet-popup-content { margin: 10px 12px; }
</style>
</head>
<body>

<div id="mapContainer"></div>

<span class="brand-tiny">TransportArte</span>
<button class="theme-toggle-btn" id="themeToggleBtn" type="button">🌙</button>

<div class="bottom-card" id="bottomCard">
  <button class="sheet-summary" id="sheetSummary" type="button">
    <span id="sheetSummaryText">Elegí tu origen y destino</span>
    <span class="sheet-chevron" id="sheetChevron">Minimizar <span class="arrow">▴</span></span>
  </button>
  <div id="sheetBody">
    <div class="field">
      <label>Origen</label>
      <input type="text" id="originSearch" placeholder="Buscá una dirección, o tocá el mapa" autocomplete="off">
      <div class="suggest-list" id="originSuggest" hidden></div>
    </div>
    <button class="locate-btn" id="useMyLocation" type="button">📍 Mi ubicación actual</button>

    <div class="field">
      <label>Destino</label>
      <input type="text" id="destSearch" placeholder="Buscá una dirección, o tocá el mapa" autocomplete="off">
      <div class="suggest-list" id="destSuggest" hidden></div>
    </div>

    <p class="sheet-hint" id="mapInstruction">Tocá un campo, o directamente el mapa, para elegir tus puntos. Tocando un pin puesto en el mapa lo borrás para volver a marcarlo.</p>
  </div>

  <button class="sheet-summary" id="resultsSummary" type="button" hidden>
    <span id="resultsSummaryText">Resultados</span>
    <span class="sheet-chevron" id="resultsChevron">Minimizar <span class="arrow">▴</span></span>
  </button>
  <div id="resultsArea"></div>
  <button class="search-btn" id="searchBtn" type="button" disabled>Buscar viaje</button>
</div>

<div id="toastRoot"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
<script>
(function(){
  "use strict";

  var API_BASE = 'https://api.santiagososa.com.ar/';
  var STORAGE_KEY = 'transportarte_last_v1';
  var THEME_KEY = 'transportarte_theme_v1';

  var state = { origin: null, dest: null };

  function pad(n) { return String(n).padStart(2, '0'); }
  function fmtClockTime(ms) {
    var d = new Date(ms);
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(msg) {
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.getElementById('toastRoot').appendChild(el);
    setTimeout(function() { el.remove(); }, 2600);
  }

  // ---------- Modo claro / oscuro ----------
  function currentEffectiveDark() {
    var explicit = document.documentElement.getAttribute('data-theme');
    if (explicit) return explicit === 'dark';
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function applyTheme(theme) {
    if (theme) document.documentElement.setAttribute('data-theme', theme);
    else document.documentElement.removeAttribute('data-theme');
    document.getElementById('themeToggleBtn').textContent = currentEffectiveDark() ? '☀️' : '🌙';
  }
  document.getElementById('themeToggleBtn').addEventListener('click', function() {
    var next = currentEffectiveDark() ? 'light' : 'dark';
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    applyTheme(next);
  });
  (function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    applyTheme(saved);
  })();

  function getCurrentPosition() {
    return new Promise(function(resolve, reject) {
      if (!navigator.geolocation) { reject(new Error('sin soporte de geolocalización')); return; }
      navigator.geolocation.getCurrentPosition(
        function(pos) { resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }); },
        function(err) { reject(new Error(err.message || 'permiso denegado')); },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
      );
    });
  }

  function mapsSearchLink(stop) {
    return (stop && stop.lat && stop.lon) ? 'https://www.google.com/maps/search/?api=1&query=' + stop.lat + ',' + stop.lon : null;
  }

  function stopLocationHtml(stop) {
    var mapsLink = mapsSearchLink(stop);
    var walkLine = (typeof stop.walkMeters === 'number') ? (' · ~' + stop.walkMeters + ' m caminando') : '';
    return '<p style="font-size:13.5px;font-weight:700;margin:0 0 2px;">' + escapeHtml(stop.address || stop.name) + '</p>' +
      '<p style="font-size:11.5px;margin:0 0 6px;color:var(--muted);">Parada ' + escapeHtml(stop.name) + walkLine +
      (mapsLink ? ' · <a href="' + mapsLink + '" target="_blank" rel="noopener" class="link-btn" style="font-size:11.5px;">Ver en el mapa</a>' : '') +
      '</p>';
  }

  function walkMins(meters) { return Math.max(1, Math.round(meters / 70)); }

  function originWalkStep(c) {
    if (!c.originWalkMeters || c.originWalkMeters < 50) return '';
    return journeyStep('Caminás', 'walk', '', { label: c.originStop.address || c.originStop.name, stop: c.originStop },
      '~' + c.originWalkMeters + ' m (unos ' + walkMins(c.originWalkMeters) + ' min) hasta la parada');
  }

  function destWalkStep(c) {
    if (!c.destWalkMeters || c.destWalkMeters < 30) return '';
    return journeyStep('Caminás', 'walk', '', null,
      '~' + c.destWalkMeters + ' m (unos ' + walkMins(c.destWalkMeters) + ' min) · Llegás ~' + fmtClockTime(c.arrivalTime));
  }

  function journeyStep(tag, tagClass, routeLine, place, timeLine) {
    var routePart = routeLine ? '<div class="step-route">' + escapeHtml(routeLine) + '</div>' : '';
    var placePart = '';
    if (place && place.label) {
      var link = mapsSearchLink(place.stop);
      placePart = '<div class="step-place">' + escapeHtml(place.label) + (link ? ' · <a href="' + link + '" target="_blank" rel="noopener" class="link-btn">Ver en el mapa</a>' : '') + '</div>';
    }
    return '<div class="journey-step">' +
      '<span class="step-tag ' + tagClass + '">' + tag + '</span>' +
      '<div class="step-body">' + routePart + placePart + '<div class="step-time">' + escapeHtml(timeLine) + '</div></div>' +
    '</div>';
  }

  function arrivalsHtml(arrivals) {
    if (!arrivals.length) return '<p style="font-size:12.5px;color:var(--muted);margin:4px 0 0;">No hay llegadas previstas por ahora.</p>';
    var now = Date.now();
    var rows = arrivals.slice(0, 5).map(function(a) {
      var t = a.predictedArrivalTime || a.scheduledArrivalTime;
      var mins = Math.round((t - now) / 60000);
      var route = a.routeShortName || a.routeId || '';
      return '<div class="arrival"><div class="journey-head"><span class="step-route">' + escapeHtml(route + ' · ' + (a.tripHeadsign || '')) + '</span><span class="journey-when">' + (mins <= 0 ? 'Ahora' : mins + ' min') + '</span></div></div>';
    }).join('');
    return rows;
  }

  function candidatesHtml(candidates) {
    var now = Date.now();
    return candidates.map(function(c, i) {
      var mins = Math.round((c.originTime - now) / 60000);
      var hasDestWalk = c.destWalkMeters >= 30;
      return '<div class="arrival convenient" data-idx="' + i + '">' +
        '<div class="journey-head"><span class="step-route">' + escapeHtml(c.route + ' · ' + c.headsign) + '</span><span class="journey-when">' + (mins <= 0 ? 'Ahora' : mins + ' min') + '</span></div>' +
        originWalkStep(c) +
        journeyStep('Subís', 'board', '', { label: c.originStop.address || c.originStop.name, stop: c.originStop }, 'Sale a las ' + fmtClockTime(c.originTime)) +
        journeyStep('Bajás', 'alight', '', { label: c.destStop.address || c.destStop.name, stop: c.destStop }, (hasDestWalk ? 'Baja ~' : 'Llegás ~') + fmtClockTime(c.destTime)) +
        destWalkStep(c) +
      '</div>';
    }).join('');
  }

  function twoLegCandidatesHtml(candidates) {
    var now = Date.now();
    return candidates.map(function(c, i) {
      var mins = Math.round((c.originTime - now) / 60000);
      var transferLabel = c.transferStop ? (c.transferStop.address || c.transferStop.name) : 'la parada de trasbordo';
      var hasDestWalk = c.destWalkMeters >= 30;
      var transferWalkStep = '';
      if (c.walkMeters > 0 && c.boardStop) {
        transferWalkStep = journeyStep('Caminás', 'walk', '', { label: c.boardStop.address || c.boardStop.name, stop: c.boardStop }, '~' + c.walkMeters + ' m (unos ' + walkMins(c.walkMeters) + ' min)');
      }
      return '<div class="arrival convenient" data-idx="' + i + '">' +
        '<div class="journey-head"><span class="step-route">' + escapeHtml(c.leg1Route) + ' · con transbordo</span><span class="journey-when">' + (mins <= 0 ? 'Ahora' : mins + ' min') + '</span></div>' +
        originWalkStep(c) +
        journeyStep('Subís', 'board', c.leg1Headsign, { label: c.originStop.address || c.originStop.name, stop: c.originStop }, 'Sale a las ' + fmtClockTime(c.originTime)) +
        journeyStep('Bajás', 'alight', '', { label: transferLabel, stop: c.transferStop }, 'Llegás ~' + fmtClockTime(c.transferArrival)) +
        transferWalkStep +
        journeyStep('Subís', 'board', c.leg2Route + ' · ' + c.leg2Headsign, null, 'Sale ~' + fmtClockTime(c.transferBoard)) +
        journeyStep('Bajás', 'alight', '', { label: c.destStop.address || c.destStop.name, stop: c.destStop }, (hasDestWalk ? 'Baja ~' : 'Llegás ~') + fmtClockTime(c.destTime)) +
        destWalkStep(c) +
      '</div>';
    }).join('');
  }

  function fetchRoute(fromLat, fromLon, toLat, toLon) {
    var url = API_BASE + 'route.json?fromLat=' + fromLat + '&fromLon=' + fromLon + '&toLat=' + toLat + '&toLon=' + toLon;
    return fetch(url).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(body) {
      if (body.code !== 200) throw new Error(body.text || ('código ' + body.code));
      return body.data;
    });
  }

  function mapsDirUrl() {
    if (!state.origin || !state.dest) return '#';
    return 'https://www.google.com/maps/dir/?api=1&origin=' + state.origin.lat + ',' + state.origin.lon +
      '&destination=' + state.dest.lat + ',' + state.dest.lon + '&travelmode=transit';
  }

  function chevronHtml(collapsed) {
    return collapsed ? 'Ver más <span class="arrow">▾</span>' : 'Minimizar <span class="arrow">▴</span>';
  }

  function setResultsCollapsed(collapsed) {
    document.getElementById('resultsArea').hidden = collapsed;
    document.getElementById('resultsChevron').innerHTML = chevronHtml(collapsed);
  }
  document.getElementById('resultsSummary').addEventListener('click', function() {
    setResultsCollapsed(!document.getElementById('resultsArea').hidden);
  });
  function showResultsSummary(text) {
    document.getElementById('resultsSummaryText').textContent = text;
    document.getElementById('resultsSummary').hidden = false;
    setResultsCollapsed(false);
  }
  function hideResultsSummary() {
    document.getElementById('resultsSummary').hidden = true;
  }

  function renderResults(data) {
    var el = document.getElementById('resultsArea');
    var mapsLink = '<div class="btn-row"><a class="btn btn-outline btn-full" style="text-align:center;text-decoration:none;" href="' + mapsDirUrl() + '" target="_blank" rel="noopener">Ver ruta completa en Google Maps</a></div>';
    if (data.direct && data.direct.length) {
      lastCandidates = data.direct;
      lastCandidateType = 'direct';
      showResultsSummary('Mejores opciones (' + data.direct.length + ') · tocá una para ver el recorrido');
      el.innerHTML = '<div class="transit-result">' + candidatesHtml(data.direct) + '</div>' + mapsLink;
      highlightCandidate(0);
      return;
    }
    if (data.transfer && data.transfer.length) {
      lastCandidates = data.transfer;
      lastCandidateType = 'transfer';
      showResultsSummary('Combinaciones con transbordo (' + data.transfer.length + ') · tocá una para ver el recorrido');
      el.innerHTML = '<div class="transit-result">' + twoLegCandidatesHtml(data.transfer) + '</div>' + mapsLink;
      highlightCandidate(0);
      return;
    }
    lastCandidates = [];
    lastCandidateType = null;
    clearRouteLines();
    showResultsSummary('Paradas cercanas');
    var fb = data.fallback || {};
    var html = '<div class="section-title">Cerca de donde salís</div>' +
      '<div class="card">' + (fb.originStop ? stopLocationHtml(fb.originStop) + arrivalsHtml(fb.originArrivals || []) : '<p style="font-size:13px;color:var(--muted);">No se encontraron paradas cercanas.</p>') + '</div>' +
      '<p style="font-size:12px;color:var(--muted);margin:4px 0 12px;">No encontramos ni una línea directa ni una combinación con transbordo entre las paradas cercanas.</p>' +
      '<div class="section-title">Cerca de a dónde vas</div>' +
      '<div class="card">' + (fb.destStop ? stopLocationHtml(fb.destStop) : '<p style="font-size:13px;color:var(--muted);">No se encontró una parada cercana.</p>') + '</div>' +
      mapsLink;
    el.innerHTML = html;
  }

  function fetchGeocode(q) {
    var url = API_BASE + 'geocode.json?q=' + encodeURIComponent(q);
    return fetch(url).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(body) {
      if (body.code !== 200) throw new Error(body.text || ('código ' + body.code));
      return body.data;
    });
  }

  function fetchReverseGeocode(lat, lon) {
    var url = API_BASE + 'reverse.json?lat=' + lat + '&lon=' + lon;
    return fetch(url).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(body) {
      if (body.code !== 200) throw new Error(body.text || ('código ' + body.code));
      return body.data && body.data.label;
    });
  }

  // ---------- Mapa persistente (Leaflet + tiles de Esri, sin API key) ----------
  // Usamos World Street Map: a diferencia del basemap "Canvas" minimalista que
  // probamos antes, éste sí trae nombres de calles secundarias, no sólo las
  // principales. No tiene variante oscura gratis, así que el modo oscuro se
  // logra invirtiendo sus colores con CSS (ver la regla de .leaflet-tile-pane).
  var TILE_URL = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}';
  var TILE_ATTRIBUTION = 'Tiles &copy; <a href="https://www.esri.com">Esri</a> — Esri, HERE, Garmin, USGS, Intermap, ' +
    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, GIS User Community';

  function pinIcon(color) {
    return L.divIcon({
      className: '',
      html: '<div style="width:24px;height:24px;border-radius:50% 50% 50% 0;background:' + color +
        ';border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.4);transform:rotate(-45deg);"></div>',
      iconSize: [24, 24],
      iconAnchor: [12, 24]
    });
  }

  var leafletMap = L.map('mapContainer', { zoomControl: false }).setView([-32.89, -68.84], 13);
  L.tileLayer(TILE_URL, { maxZoom: 19, attribution: TILE_ATTRIBUTION }).addTo(leafletMap);
  L.control.zoom({ position: 'bottomright' }).addTo(leafletMap);

  // ---------- Paradas visibles en el mapa: tocar una muestra sus próximos colectivos ----------
  // Igual que la app oficial: sólo a partir de cierto zoom (si no, serían
  // cientos de puntos), y se recarga (con demora) cada vez que movés o
  // acercás el mapa.
  var STOP_PIN_MIN_ZOOM = 15;
  var stopMarkersLayer = L.layerGroup().addTo(leafletMap);
  var stopMarkersById = {};
  var stopRefreshTimer = null;

  function stopIcon() {
    return L.divIcon({ className: 'stop-dot', html: '', iconSize: [12, 12], iconAnchor: [6, 6] });
  }

  function fetchStopArrivals(stopId) {
    var url = API_BASE + 'arrivals-and-departures-for-stop/' + encodeURIComponent(stopId) + '.json?platform=web&v=&minutesBefore=0&minutesAfter=65&version=1.0';
    return fetch(url).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(body) {
      if (body.code !== 200) throw new Error(body.text || ('código ' + body.code));
      // El shapeId (para dibujar el recorrido) viene en references.trips, no
      // en cada llegada - lo copiamos a cada una para no tener que cruzar
      // ambas listas cada vez que se toca un colectivo.
      var shapeIdByTrip = {};
      ((body.data.references && body.data.references.trips) || []).forEach(function(t) {
        if (t.shapeId) shapeIdByTrip[t.id] = t.shapeId;
      });
      var arrivals = (body.data.entry && body.data.entry.arrivalsAndDepartures) || [];
      arrivals.forEach(function(a) { a.shapeId = shapeIdByTrip[a.tripId] || null; });
      return arrivals;
    });
  }

  // Igual que arrivalsHtml, pero cada llegada queda marcada con su shapeId
  // para poder tocarla y dibujar el recorrido de ese colectivo.
  function stopArrivalsHtml(arrivals) {
    if (!arrivals.length) return '<p style="font-size:12.5px;color:var(--muted);margin:4px 0 0;">No hay llegadas previstas por ahora.</p>';
    var now = Date.now();
    return arrivals.slice(0, 5).map(function(a) {
      var t = a.predictedArrivalTime || a.scheduledArrivalTime;
      var mins = Math.round((t - now) / 60000);
      var route = a.routeShortName || a.routeId || '';
      return '<div class="arrival" data-shape="' + escapeHtml(a.shapeId || '') + '"><div class="journey-head"><span class="step-route">' + escapeHtml(route + ' · ' + (a.tripHeadsign || '')) + '</span><span class="journey-when">' + (mins <= 0 ? 'Ahora' : mins + ' min') + '</span></div></div>';
    }).join('');
  }

  function wireStopPopupClicks(marker) {
    var popup = marker.getPopup();
    var el = popup && popup.getElement();
    if (!el) return;
    el.querySelectorAll('.arrival[data-shape]').forEach(function(card) {
      card.addEventListener('click', function() {
        var shapeId = card.getAttribute('data-shape');
        if (!shapeId) { toast('Esta línea no tiene el recorrido disponible.'); return; }
        drawSingleBusShape(shapeId);
      });
    });
  }

  function openStopPopup(stop, marker) {
    marker.setPopupContent('<div class="stop-popup"><p class="stop-popup-title">' + escapeHtml(stop.address || stop.name) + '</p><p style="color:var(--muted);">Buscando llegadas...</p></div>');
    fetchStopArrivals(stop.id).then(function(arrivals) {
      marker.setPopupContent('<div class="stop-popup"><p class="stop-popup-title">' + escapeHtml(stop.address || stop.name) + '</p>' + stopArrivalsHtml(arrivals) + '</div>');
      wireStopPopupClicks(marker);
    }).catch(function() {
      marker.setPopupContent('<div class="stop-popup"><p class="stop-popup-title">' + escapeHtml(stop.address || stop.name) + '</p><p style="color:var(--muted);">No pudimos cargar las llegadas.</p></div>');
    });
  }

  function refreshVisibleStops() {
    if (leafletMap.getZoom() < STOP_PIN_MIN_ZOOM) { stopMarkersLayer.clearLayers(); stopMarkersById = {}; return; }
    var b = leafletMap.getBounds();
    var lat = (b.getNorth() + b.getSouth()) / 2;
    var lon = (b.getEast() + b.getWest()) / 2;
    var latSpan = Math.min(0.02, (b.getNorth() - b.getSouth()) * 1.2);
    var lonSpan = Math.min(0.02, (b.getEast() - b.getWest()) * 1.2);
    var url = API_BASE + 'stops-for-location.json?lat=' + lat + '&lon=' + lon + '&latSpan=' + latSpan + '&lonSpan=' + lonSpan;
    fetch(url).then(function(res) { return res.json(); }).then(function(body) {
      if (body.code !== 200) return;
      var list = (body.data && (body.data.list || body.data.stops)) || [];
      var seenIds = {};
      list.forEach(function(stop) {
        seenIds[stop.id] = true;
        if (stopMarkersById[stop.id]) return;
        var marker = L.marker([stop.lat, stop.lon], { icon: stopIcon() });
        marker.bindPopup('', { maxWidth: 240 });
        marker.on('click', function() { openStopPopup(stop, marker); });
        marker.addTo(stopMarkersLayer);
        stopMarkersById[stop.id] = marker;
      });
      Object.keys(stopMarkersById).forEach(function(id) {
        if (seenIds[id]) return;
        stopMarkersLayer.removeLayer(stopMarkersById[id]);
        delete stopMarkersById[id];
      });
    }).catch(function() { /* si falla, dejamos los pines que ya había */ });
  }

  leafletMap.on('moveend zoomend', function() {
    clearTimeout(stopRefreshTimer);
    stopRefreshTimer = setTimeout(refreshVisibleStops, 350);
  });

  var originMarker = null;
  var destMarker = null;
  var myLocationMarker = null;
  var geoWatchId = null;
  var armedTarget = null; // 'origin' | 'dest' | null
  var routeLineLayers = [];

  // Decodifica un polyline de Google (el formato que usa OneBusAway para el
  // recorrido real de cada colectivo) a una lista de [lat, lon].
  function decodePolyline(str) {
    var index = 0, lat = 0, lon = 0, coords = [];
    while (index < str.length) {
      var b, shift = 0, result = 0;
      do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      lat += (result & 1) ? ~(result >> 1) : (result >> 1);
      shift = 0; result = 0;
      do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      lon += (result & 1) ? ~(result >> 1) : (result >> 1);
      coords.push([lat / 1e5, lon / 1e5]);
    }
    return coords;
  }

  function fetchShapePoints(shapeId) {
    var url = API_BASE + 'shape/' + encodeURIComponent(shapeId) + '.json?platform=web&v=&version=1.0';
    return fetch(url).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(body) {
      if (body.code !== 200) throw new Error(body.text || ('código ' + body.code));
      var points = body.data && body.data.entry && body.data.entry.points;
      if (!points) throw new Error('sin recorrido disponible');
      return decodePolyline(points);
    });
  }

  function clearRouteLines() {
    routeLineLayers.forEach(function(l) { leafletMap.removeLayer(l); });
    routeLineLayers = [];
  }

  var lastCandidates = [];
  var lastCandidateType = null; // 'direct' | 'transfer' | null

  function addRouteLayer(layer) {
    layer.addTo(leafletMap);
    routeLineLayers.push(layer);
    return layer;
  }

  function stopMarkerIcon(color, label) {
    return L.divIcon({
      className: '',
      html: '<div style="width:22px;height:22px;border-radius:50%;background:' + color +
        ';border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;' +
        'font-size:10.5px;font-weight:800;color:#fff;line-height:1;">' + label + '</div>',
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });
  }

  // Dibuja el recorrido real de un colectivo (con flechitas de sentido, ya
  // que las líneas se cruzan y sin eso no se distingue para dónde va) y junta
  // sus puntos en boundsPoints para poder encuadrar el mapa después.
  function drawBusShape(shapeId, boundsPoints) {
    if (!shapeId) return Promise.resolve();
    return fetchShapePoints(shapeId).then(function(coords) {
      if (!coords || !coords.length) return;
      var line = addRouteLayer(L.polyline(coords, { color: '#2f7dd6', weight: 5, opacity: 0.85 }));
      addRouteLayer(L.polylineDecorator(line, {
        patterns: [{
          offset: 20, repeat: 90,
          symbol: L.Symbol.arrowHead({ pixelSize: 11, polygon: false, pathOptions: { color: '#123f7a', weight: 3, opacity: 0.9 } })
        }]
      }));
      boundsPoints.push.apply(boundsPoints, coords);
    }).catch(function() { /* sin recorrido disponible para este tramo */ });
  }

  // Línea punteada (recta) para los tramos a pie: origen -> parada de subida,
  // caminata de transbordo, y parada de bajada -> destino real. Probamos
  // ruteo peatonal real vía OSRM, pero en zonas con poco detalle peatonal en
  // OpenStreetMap terminaba desviándose por avenidas grandes en vez de cortar
  // por las calles internas - una línea recta, aunque no siga la vereda
  // exacta, es más honesta que un desvío que parece real pero no lo es.
  function drawWalkLine(from, to, boundsPoints) {
    if (!from || !to || from.lat == null || to.lat == null) return Promise.resolve();
    var pts = [[from.lat, from.lon], [to.lat, to.lon]];
    addRouteLayer(L.polyline(pts, { color: '#b7791f', weight: 3.5, opacity: 0.9, dashArray: '1, 11', lineCap: 'round' }));
    boundsPoints.push.apply(boundsPoints, pts);
    return Promise.resolve();
  }

  function drawStopMarker(stop, color, label, boundsPoints) {
    if (!stop || stop.lat == null || stop.lon == null) return;
    addRouteLayer(L.marker([stop.lat, stop.lon], { icon: stopMarkerIcon(color, label) }));
    boundsPoints.push([stop.lat, stop.lon]);
  }

  function finishRouteDraw(boundsPoints) {
    if (!boundsPoints.length) { toast('No pudimos cargar el recorrido de esta línea.'); return; }
    leafletMap.fitBounds(L.latLngBounds(boundsPoints), { paddingTopLeft: [30, 60], paddingBottomRight: [30, 280] });
  }

  // Dibuja el recorrido de un solo colectivo (usado al tocar uno en el popup
  // de una parada), sin comparar con otras opciones.
  function drawSingleBusShape(shapeId) {
    clearRouteLines();
    var bounds = [];
    drawBusShape(shapeId, bounds).then(function() { finishRouteDraw(bounds); });
  }

  // Línea de fondo (sin flechas) para las opciones que NO están resaltadas,
  // más tenue que la elegida para poder comparar todas de un vistazo.
  function drawDimShape(shapeId, boundsPoints) {
    if (!shapeId) return Promise.resolve();
    return fetchShapePoints(shapeId).then(function(coords) {
      if (!coords || !coords.length) return;
      addRouteLayer(L.polyline(coords, { color: '#2f7dd6', weight: 4, opacity: 0.25 }));
      boundsPoints.push.apply(boundsPoints, coords);
    }).catch(function() { /* sin recorrido disponible para este tramo */ });
  }

  function shapeIdsFor(c) {
    return lastCandidateType === 'direct' ? [c.shapeId] : [c.leg1ShapeId, c.leg2ShapeId];
  }

  function drawStopsAndWalks(c, boundsPoints) {
    drawStopMarker(c.originStop, '#2f7dd6', 'S', boundsPoints);
    var tasks = [drawWalkLine(state.origin, c.originStop, boundsPoints)];
    if (lastCandidateType === 'transfer') {
      if (c.boardStop) {
        // Bajás de la primera línea y caminás hasta otra parada para la segunda.
        drawStopMarker(c.transferStop, '#123f7a', 'B', boundsPoints);
        drawStopMarker(c.boardStop, '#2f7dd6', 'S', boundsPoints);
        tasks.push(drawWalkLine(c.transferStop, c.boardStop, boundsPoints));
      } else {
        // El transbordo es en la misma parada: un solo pin para bajar y subir.
        drawStopMarker(c.transferStop, '#6b4fa0', '⇄', boundsPoints);
      }
    }
    drawStopMarker(c.destStop, '#123f7a', 'B', boundsPoints);
    tasks.push(drawWalkLine(c.destStop, state.dest, boundsPoints));
    return tasks;
  }

  // Dibuja TODAS las opciones encontradas a la vez (para poder comparar),
  // con la elegida en color fuerte y flechas de sentido, y el resto atenuadas
  // de fondo. Las atenuadas se pintan primero para que la resaltada quede
  // siempre por encima.
  function highlightCandidate(idx) {
    if (!lastCandidates.length || !lastCandidates[idx]) return;
    clearRouteLines();
    var bounds = [];
    var dimTasks = [];
    lastCandidates.forEach(function(c, i) {
      if (i === idx) return;
      shapeIdsFor(c).filter(Boolean).forEach(function(shapeId) { dimTasks.push(drawDimShape(shapeId, bounds)); });
    });
    Promise.all(dimTasks).then(function() {
      var top = lastCandidates[idx];
      var topTasks = shapeIdsFor(top).filter(Boolean).map(function(shapeId) { return drawBusShape(shapeId, bounds); });
      topTasks = topTasks.concat(drawStopsAndWalks(top, bounds));
      return Promise.all(topTasks);
    }).then(function() { finishRouteDraw(bounds); });
  }

  document.getElementById('resultsArea').addEventListener('click', function(e) {
    if (e.target.closest('a')) return;
    var card = e.target.closest('.arrival[data-idx]');
    if (!card) return;
    highlightCandidate(parseInt(card.getAttribute('data-idx'), 10));
  });

  function startLiveLocation() {
    if (!navigator.geolocation) return;
    geoWatchId = navigator.geolocation.watchPosition(function(pos) {
      var lat = pos.coords.latitude, lon = pos.coords.longitude;
      if (myLocationMarker) { myLocationMarker.setLatLng([lat, lon]); }
      else {
        myLocationMarker = L.marker([lat, lon], {
          icon: L.divIcon({ className: 'my-location-dot', html: '', iconSize: [16, 16], iconAnchor: [8, 8] }),
          zIndexOffset: 1000,
          interactive: false
        }).addTo(leafletMap);
      }
    }, function() { /* sin permiso o sin señal: seguimos sin el puntito */ }, {
      enableHighAccuracy: true, maximumAge: 5000, timeout: 10000
    });
  }
  startLiveLocation();

  function defaultCoordLabel(coords) { return coords.lat.toFixed(5) + ', ' + coords.lon.toFixed(5); }

  // ---------- Panel inferior: minimizar/expandir el selector de origen/destino ----------
  function setSheetCollapsed(collapsed) {
    document.getElementById('sheetBody').hidden = collapsed;
    document.getElementById('sheetChevron').innerHTML = chevronHtml(collapsed);
  }
  document.getElementById('sheetSummary').addEventListener('click', function() {
    setSheetCollapsed(!document.getElementById('sheetBody').hidden);
  });
  function updateSheetSummary() {
    var el = document.getElementById('sheetSummaryText');
    if (!state.origin && !state.dest) { el.textContent = 'Elegí tu origen y destino'; return; }
    var o = state.origin ? document.getElementById('originSearch').value : '¿Origen?';
    var d = state.dest ? document.getElementById('destSearch').value : '¿Destino?';
    el.textContent = o + '  →  ' + d;
  }

  // Actualiza sólo el texto mostrado en el campo (usado tanto al fijar un
  // punto como al llegar la dirección "linda" de la geocodificación inversa).
  function setFieldValue(target, text) {
    document.getElementById(target === 'origin' ? 'originSearch' : 'destSearch').value = text;
    updateSheetSummary();
  }

  // Tocar el pin puesto en el mapa lo borra y arma ese mismo color para el
  // próximo toque - así se puede corregir un punto sin pasar por el campo.
  function clearPoint(target) {
    if (target === 'origin') {
      state.origin = null;
      if (originMarker) { leafletMap.removeLayer(originMarker); originMarker = null; }
      setFieldValue('origin', '');
    } else {
      state.dest = null;
      if (destMarker) { leafletMap.removeLayer(destMarker); destMarker = null; }
      setFieldValue('dest', '');
    }
    updateSearchEnabled();
    clearRouteLines();
    armTarget(target);
  }

  function placeMarker(target, coords) {
    if (target === 'origin') {
      if (originMarker) originMarker.setLatLng([coords.lat, coords.lon]);
      else {
        originMarker = L.marker([coords.lat, coords.lon], { icon: pinIcon('#1f9d55') }).addTo(leafletMap);
        originMarker.on('click', function() { clearPoint('origin'); });
      }
    } else {
      if (destMarker) destMarker.setLatLng([coords.lat, coords.lon]);
      else {
        destMarker = L.marker([coords.lat, coords.lon], { icon: pinIcon('#d92d20') }).addTo(leafletMap);
        destMarker.on('click', function() { clearPoint('dest'); });
      }
    }
  }

  function fitMapToPoints() {
    if (state.origin && state.dest) {
      leafletMap.fitBounds(L.latLngBounds([
        [state.origin.lat, state.origin.lon],
        [state.dest.lat, state.dest.lon]
      ]), { paddingTopLeft: [30, 60], paddingBottomRight: [30, 280] });
    } else if (state.origin) {
      leafletMap.setView([state.origin.lat, state.origin.lon], 15);
    } else if (state.dest) {
      leafletMap.setView([state.dest.lat, state.dest.lon], 15);
    }
  }

  function armTarget(target) {
    armedTarget = target;
    document.getElementById('originSearch').classList.toggle('armed', target === 'origin');
    document.getElementById('destSearch').classList.toggle('armed', target === 'dest');
    var hint = document.getElementById('mapInstruction');
    if (target === 'origin') hint.textContent = 'Tocá el mapa para marcar tu punto de partida.';
    else if (target === 'dest') hint.textContent = 'Ahora tocá el mapa para marcar tu destino.';
    else hint.textContent = 'Tocá "Buscar viaje", o un pin en el mapa para volver a marcarlo.';
    // Con ambos puntos listos, minimizamos el selector para dejar ver el mapa;
    // apenas hay que elegir (o corregir) un punto, lo volvemos a expandir.
    setSheetCollapsed(target === null && !!(state.origin && state.dest));
  }

  function updateSearchEnabled() {
    document.getElementById('searchBtn').disabled = !(state.origin && state.dest);
  }

  function onPointSet(justSet) {
    if (justSet === 'origin') armTarget(state.dest ? null : 'dest');
    else armTarget(state.origin ? null : 'origin');
    fitMapToPoints();
  }

  function setOrigin(coords, label) {
    state.origin = coords;
    setFieldValue('origin', label || defaultCoordLabel(coords));
    placeMarker('origin', coords);
    updateSearchEnabled();
    onPointSet('origin');
  }
  function setDest(coords, label) {
    state.dest = coords;
    setFieldValue('dest', label || defaultCoordLabel(coords));
    placeMarker('dest', coords);
    updateSearchEnabled();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ lat: coords.lat, lon: coords.lon })); } catch (e) {}
    onPointSet('dest');
  }

  function pickPointFromMap(target, lat, lon) {
    var coords = { lat: lat, lon: lon };
    if (target === 'origin') setOrigin(coords, 'Buscando la dirección...');
    else setDest(coords, 'Buscando la dirección...');
    fetchReverseGeocode(lat, lon).then(function(label) {
      setFieldValue(target, label || defaultCoordLabel(coords));
    }).catch(function() {
      setFieldValue(target, defaultCoordLabel(coords));
    });
  }

  leafletMap.on('click', function(e) {
    if (!armedTarget) return;
    pickPointFromMap(armedTarget, e.latlng.lat, e.latlng.lng);
  });

  // Tocar cualquiera de los dos campos arma ese punto para el próximo toque
  // en el mapa, igual que antes lo hacían los chips.
  document.getElementById('originSearch').addEventListener('focus', function() { armTarget('origin'); });
  document.getElementById('destSearch').addEventListener('focus', function() { armTarget('dest'); });

  document.getElementById('useMyLocation').addEventListener('click', function() {
    var btn = this;
    btn.disabled = true;
    btn.textContent = 'Ubicándote...';
    getCurrentPosition().then(function(pos) {
      setOrigin(pos, 'Tu ubicación (' + pos.lat.toFixed(5) + ', ' + pos.lon.toFixed(5) + ')');
    }).catch(function(err) {
      toast('No pudimos usar tu ubicación (' + err.message + ').');
    }).then(function() {
      btn.disabled = false;
      btn.textContent = '📍 Mi ubicación actual';
    });
  });

  function setupAddressSearch(inputId, suggestId, onPick) {
    var input = document.getElementById(inputId);
    var suggestBox = document.getElementById(suggestId);
    var timer = null;
    var requestId = 0;

    input.addEventListener('input', function() {
      var q = input.value.trim();
      if (timer) clearTimeout(timer);
      if (q.length < 3) { suggestBox.hidden = true; suggestBox.innerHTML = ''; return; }
      timer = setTimeout(function() {
        var myId = ++requestId;
        suggestBox.hidden = false;
        suggestBox.innerHTML = '<div class="suggest-loading">Buscando...</div>';
        var query = /mendoza/i.test(q) ? q : (q + ', Mendoza, Argentina');
        fetchGeocode(query).then(function(results) {
          if (myId !== requestId) return;
          if (!results.length) {
            suggestBox.innerHTML = '<div class="suggest-loading">Sin resultados. Probá con más detalle, o tocá el mapa directamente.</div>';
            return;
          }
          suggestBox.innerHTML = results.map(function(r, i) {
            return '<button type="button" data-i="' + i + '">' + escapeHtml(r.label) + '</button>';
          }).join('');
          Array.prototype.forEach.call(suggestBox.querySelectorAll('button'), function(btn) {
            btn.addEventListener('click', function() {
              var r = results[parseInt(btn.getAttribute('data-i'), 10)];
              input.value = r.label;
              suggestBox.hidden = true;
              onPick({ lat: r.lat, lon: r.lon }, r.label);
            });
          });
        }).catch(function(err) {
          if (myId !== requestId) return;
          suggestBox.innerHTML = '<div class="suggest-loading">No se pudo buscar (' + escapeHtml(err.message) + ').</div>';
        });
      }, 450);
    });

    document.addEventListener('click', function(e) {
      if (e.target !== input && !suggestBox.contains(e.target)) suggestBox.hidden = true;
    });
  }

  setupAddressSearch('originSearch', 'originSuggest', function(coords, label) { setOrigin(coords, label); });
  setupAddressSearch('destSearch', 'destSuggest', function(coords, label) { setDest(coords, label); });

  document.getElementById('searchBtn').addEventListener('click', function() {
    if (!state.origin || !state.dest) return;
    var btn = document.getElementById('searchBtn');
    btn.disabled = true;
    btn.textContent = 'Buscando...';
    var el = document.getElementById('resultsArea');
    hideResultsSummary();
    setResultsCollapsed(false);
    el.innerHTML = '<p class="transit-loading">Buscando las mejores opciones...</p>';
    fetchRoute(state.origin.lat, state.origin.lon, state.dest.lat, state.dest.lon)
      .then(function(data) {
        renderResults(data);
      })
      .catch(function(err) {
        clearRouteLines();
        hideResultsSummary();
        el.innerHTML = '<p class="transit-loading">No pudimos calcular la ruta (' + escapeHtml(err.message) + ').</p>';
      })
      .then(function() {
        btn.disabled = false;
        btn.textContent = 'Buscar viaje';
      });
  });

  armTarget('origin');
  document.getElementById('resultsArea').innerHTML = '';

  // Permite que otras apps abran TransportArte con el viaje precargado:
  // ?fromLat=&fromLon=&toLat=&toLon=
  (function initFromQuery() {
    var params = new URLSearchParams(location.search);
    var fromLat = parseFloat(params.get('fromLat'));
    var fromLon = parseFloat(params.get('fromLon'));
    var toLat = parseFloat(params.get('toLat'));
    var toLon = parseFloat(params.get('toLon'));
    var hasOrigin = !Number.isNaN(fromLat) && !Number.isNaN(fromLon);
    var hasDest = !Number.isNaN(toLat) && !Number.isNaN(toLon);
    if (hasOrigin) setOrigin({ lat: fromLat, lon: fromLon }, 'Recibido');
    if (hasDest) setDest({ lat: toLat, lon: toLon }, 'Recibido');
    if (hasOrigin && hasDest) {
      setTimeout(function() { document.getElementById('searchBtn').click(); }, 50);
    }
  })();
})();
</script>
</body>
</html>
