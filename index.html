<!DOCTYPE html>
<html lang="es" data-palette="cielo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TransportArte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --radius: 14px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-palette="cielo"] {
    --bg: #eef5fb;
    --surface: #ffffff;
    --surface-2: #e1edf7;
    --text: #1c2b3a;
    --muted: #64798d;
    --border: #d3e2ee;
    --primary: #2f7dd6;
    --primary-dark: #1f5fac;
    --success: #1f9d55;
    --success-bg: #e5f7ea;
    --warning: #b7791f;
    --warning-bg: #fdf3dd;
    --danger: #d92d20;
    --danger-bg: #fde8e6;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-palette="cielo"] {
      --bg: #0f1720;
      --surface: #16212c;
      --surface-2: #1e2b38;
      --text: #e7eef5;
      --muted: #93a6b8;
      --border: #2a3a4a;
      --primary: #5b9be8;
      --primary-dark: #3f7dd0;
      --success: #34c471;
      --success-bg: #113322;
      --warning: #e0ac48;
      --warning-bg: #3a2c0c;
      --danger: #f16a5e;
      --danger-bg: #3a1613;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    overscroll-behavior-y: contain;
    -webkit-text-size-adjust: 100%;
  }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  button { font-family: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  input, select, textarea { font-family: inherit; font-size: 16px; }

  #mapContainer { position: fixed; inset: 0; z-index: 0; background: var(--surface-2); }

  .map-ui-top {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 30;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 12px 0;
    pointer-events: none;
  }
  .brand-tiny {
    display: block;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 13px;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.55);
    margin: 0 0 8px 3px;
  }
  .point-chip {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    text-align: left;
  }
  .point-chip + .point-chip { margin-top: 7px; }
  .point-chip.filled { color: var(--text); font-weight: 700; }
  .point-chip.armed { outline: 2px solid var(--primary); outline-offset: -2px; }
  .chip-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .chip-dot-origin { background: var(--success); }
  .chip-dot-dest { background: var(--danger); }
  .chip-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .map-instruction {
    pointer-events: none;
    margin: 8px 3px 0;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.65);
  }

  .picker-popover {
    pointer-events: auto;
    margin-top: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    box-shadow: 0 8px 26px rgba(0,0,0,0.22);
    max-height: 60vh;
    overflow-y: auto;
  }
  .popover-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .popover-head span { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 15px; }
  .popover-head button {
    border: none;
    background: var(--surface-2);
    width: 28px; height: 28px;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
    color: var(--muted);
  }

  .field { position: relative; margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .field input[type=text] {
    width: 100%;
    padding: 10px 11px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text);
  }
  .btn {
    border: none;
    padding: 11px 14px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 12px -3px var(--primary-dark); }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-full { width: 100%; padding: 13px; font-size: 15px; border-radius: 13px; }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  .suggest-list {
    position: absolute;
    left: 0; right: 0; top: 100%;
    margin-top: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    z-index: 5;
    max-height: 200px;
    overflow-y: auto;
  }
  .suggest-list button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    border: none;
    background: transparent;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
  }
  .suggest-list button + button { border-top: 1px solid var(--border); }
  .suggest-list button:hover, .suggest-list button:active { background: var(--surface-2); }
  .suggest-loading { padding: 10px 12px; font-size: 12.5px; color: var(--muted); }

  .link-toggle {
    display: block;
    background: none;
    border: none;
    color: var(--primary);
    font-size: 11.5px;
    font-weight: 700;
    padding: 6px 0 0;
    cursor: pointer;
    text-align: left;
  }

  .bottom-card {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 35;
    max-width: 560px;
    margin: 0 auto;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -6px 24px rgba(0,0,0,0.2);
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    max-height: 66vh;
    display: flex;
    flex-direction: column;
  }
  .search-btn {
    display: block;
    width: 100%;
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 15px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 16px -3px var(--primary-dark);
    flex-shrink: 0;
  }
  .search-btn:disabled { opacity: 0.6; cursor: default; }

  #resultsArea { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  #resultsArea:not(:empty) { margin-bottom: 10px; }

  .section-title {
    font-size: 12.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 4px 0 8px;
  }
  .transit-loading { color: var(--muted); font-size: 13px; text-align: center; padding: 16px; }
  .empty-hint { color: var(--muted); font-size: 13px; text-align: center; padding: 14px 4px; }

  .card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 10px;
  }

  .transit-result { display: flex; flex-direction: column; gap: 8px; }
  .arrival {
    padding: 12px 12px;
    border-radius: 13px;
    background: var(--surface-2);
  }
  .arrival.convenient { background: var(--success-bg); }
  .journey-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 8px; }
  .journey-head .journey-when { font-size: 13px; font-weight: 700; color: var(--success); white-space: nowrap; }
  .journey-step { display: flex; gap: 8px; padding: 5px 0; }
  .journey-step + .journey-step { border-top: 1px dashed var(--border); }
  .step-tag {
    flex-shrink: 0;
    font-size: 9.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 3px 8px;
    border-radius: 999px;
    height: fit-content;
    margin-top: 1px;
    background: var(--primary);
    color: #fff;
    width: 46px;
    text-align: center;
  }
  .step-tag.alight { background: var(--text); opacity: 0.75; }
  .step-tag.walk { background: var(--warning); width: 60px; }
  .step-body { flex: 1; min-width: 0; }
  .step-route { font-size: 13px; font-weight: 700; }
  .step-place { font-size: 12.5px; color: var(--text); }
  .step-place .link-btn { font-size: 11.5px; margin-left: 4px; white-space: nowrap; }
  .step-time { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .link-btn { color: var(--primary); text-decoration: none; font-weight: 700; }

  .toast {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 13px;
    z-index: 80;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    max-width: 85vw;
    text-align: center;
  }

  .my-location-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--primary);
    border: 3px solid #fff;
    box-shadow: 0 0 0 6px rgba(47,125,214,0.25), 0 2px 8px rgba(0,0,0,0.35);
    animation: locationPulse 2.2s ease-out infinite;
  }
  @keyframes locationPulse {
    0% { box-shadow: 0 0 0 4px rgba(47,125,214,0.35), 0 2px 8px rgba(0,0,0,0.35); }
    100% { box-shadow: 0 0 0 12px rgba(47,125,214,0), 0 2px 8px rgba(0,0,0,0.35); }
  }
</style>
</head>
<body>

<div id="mapContainer"></div>

<div class="map-ui-top">
  <span class="brand-tiny">TransportArte</span>
  <button class="point-chip" id="originChip" type="button">
    <span class="chip-dot chip-dot-origin"></span>
    <span class="chip-text" id="originChipText">Elegí tu punto de partida</span>
  </button>
  <button class="point-chip" id="destChip" type="button">
    <span class="chip-dot chip-dot-dest"></span>
    <span class="chip-text" id="destChipText">Elegí tu destino</span>
  </button>
  <p class="map-instruction" id="mapInstruction">Tocá un botón de arriba, o directamente el mapa, para elegir tus puntos.</p>

  <div class="picker-popover" id="pickerPopover" hidden>
    <div class="popover-head">
      <span id="popoverTitle">Origen</span>
      <button id="popoverClose" type="button">✕</button>
    </div>
    <button class="btn btn-primary btn-full" id="useMyLocation" type="button">Usar mi ubicación</button>
    <div class="field" style="margin-top:10px;">
      <label id="popoverSearchLabel">Buscá una dirección</label>
      <input type="text" id="pointSearch" placeholder="Ej: San Martín 1234, o Shopping Palmares" autocomplete="off">
      <div class="suggest-list" id="pointSuggest" hidden></div>
    </div>
    <button class="link-toggle" id="pointToggleCoords" type="button">¿Preferís pegar coordenadas o un link de Maps?</button>
    <div class="field" id="pointCoordsField" hidden>
      <input type="text" id="pointPaste" placeholder="-32,90 -68,84 o link de Maps">
    </div>
  </div>
</div>

<div class="bottom-card">
  <div id="resultsArea"></div>
  <button class="search-btn" id="searchBtn" type="button" disabled>Buscar viaje</button>
</div>

<div id="toastRoot"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function(){
  "use strict";

  var API_BASE = 'https://api.santiagososa.com.ar/';
  var STORAGE_KEY = 'transportarte_last_v1';

  var state = { origin: null, dest: null };

  function pad(n) { return String(n).padStart(2, '0'); }
  function fmtClockTime(ms) {
    var d = new Date(ms);
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(msg) {
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.getElementById('toastRoot').appendChild(el);
    setTimeout(function() { el.remove(); }, 2600);
  }

  function parseMapsCoords(text) {
    text = (text || '').trim();
    if (!text) return null;
    var esMatch = text.match(/^(-?\d{1,3},\d+)\s*,?\s+(-?\d{1,3},\d+)$/) || text.match(/^(-?\d{1,3},\d+)\s*,\s*(-?\d{1,3},\d+)$/);
    if (esMatch) {
      return { lat: parseFloat(esMatch[1].replace(',', '.')), lon: parseFloat(esMatch[2].replace(',', '.')) };
    }
    var patterns = [
      /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,
      /[?&](?:q|query)=(-?\d+\.\d+),(-?\d+\.\d+)/,
      /@(-?\d+\.\d+),(-?\d+\.\d+)/,
      /^(-?\d{1,3}\.\d+)[\s,]+(-?\d{1,3}\.\d+)$/
    ];
    for (var i = 0; i < patterns.length; i++) {
      var m = text.match(patterns[i]);
      if (m) return { lat: parseFloat(m[1]), lon: parseFloat(m[2]) };
    }
    return null;
  }

  function getCurrentPosition() {
    return new Promise(function(resolve, reject) {
      if (!navigator.geolocation) { reject(new Error('sin soporte de geolocalización')); return; }
      navigator.geolocation.getCurrentPosition(
        function(pos) { resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }); },
        function(err) { reject(new Error(err.message || 'permiso denegado')); },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
      );
    });
  }

  function mapsSearchLink(stop) {
    return (stop && stop.lat && stop.lon) ? 'https://www.google.com/maps/search/?api=1&query=' + stop.lat + ',' + stop.lon : null;
  }

  function stopLocationHtml(stop) {
    var mapsLink = mapsSearchLink(stop);
    var walkLine = (typeof stop.walkMeters === 'number') ? (' · ~' + stop.walkMeters + ' m caminando') : '';
    return '<p style="font-size:13.5px;font-weight:700;margin:0 0 2px;">' + escapeHtml(stop.address || stop.name) + '</p>' +
      '<p style="font-size:11.5px;margin:0 0 6px;color:var(--muted);">Parada ' + escapeHtml(stop.name) + walkLine +
      (mapsLink ? ' · <a href="' + mapsLink + '" target="_blank" rel="noopener" class="link-btn" style="font-size:11.5px;">Ver en el mapa</a>' : '') +
      '</p>';
  }

  function walkMins(meters) { return Math.max(1, Math.round(meters / 70)); }

  function originWalkStep(c) {
    if (!c.originWalkMeters || c.originWalkMeters < 50) return '';
    return journeyStep('Caminás', 'walk', '', { label: c.originStop.address || c.originStop.name, stop: c.originStop },
      '~' + c.originWalkMeters + ' m (unos ' + walkMins(c.originWalkMeters) + ' min) hasta la parada');
  }

  function destWalkStep(c) {
    if (!c.destWalkMeters || c.destWalkMeters < 30) return '';
    return journeyStep('Caminás', 'walk', '', null,
      '~' + c.destWalkMeters + ' m (unos ' + walkMins(c.destWalkMeters) + ' min) · Llegás ~' + fmtClockTime(c.arrivalTime));
  }

  function journeyStep(tag, tagClass, routeLine, place, timeLine) {
    var routePart = routeLine ? '<div class="step-route">' + escapeHtml(routeLine) + '</div>' : '';
    var placePart = '';
    if (place && place.label) {
      var link = mapsSearchLink(place.stop);
      placePart = '<div class="step-place">' + escapeHtml(place.label) + (link ? ' · <a href="' + link + '" target="_blank" rel="noopener" class="link-btn">Ver en el mapa</a>' : '') + '</div>';
    }
    return '<div class="journey-step">' +
      '<span class="step-tag ' + tagClass + '">' + tag + '</span>' +
      '<div class="step-body">' + routePart + placePart + '<div class="step-time">' + escapeHtml(timeLine) + '</div></div>' +
    '</div>';
  }

  function arrivalsHtml(arrivals) {
    if (!arrivals.length) return '<p style="font-size:12.5px;color:var(--muted);margin:4px 0 0;">No hay llegadas previstas por ahora.</p>';
    var now = Date.now();
    var rows = arrivals.slice(0, 5).map(function(a) {
      var t = a.predictedArrivalTime || a.scheduledArrivalTime;
      var mins = Math.round((t - now) / 60000);
      var route = a.routeShortName || a.routeId || '';
      return '<div class="arrival"><div class="journey-head"><span class="step-route">' + escapeHtml(route + ' · ' + (a.tripHeadsign || '')) + '</span><span class="journey-when">' + (mins <= 0 ? 'Ahora' : mins + ' min') + '</span></div></div>';
    }).join('');
    return rows;
  }

  function candidatesHtml(candidates) {
    var now = Date.now();
    return candidates.map(function(c) {
      var mins = Math.round((c.originTime - now) / 60000);
      var hasDestWalk = c.destWalkMeters >= 30;
      return '<div class="arrival convenient">' +
        '<div class="journey-head"><span class="step-route">' + escapeHtml(c.route + ' · ' + c.headsign) + '</span><span class="journey-when">' + (mins <= 0 ? 'Ahora' : mins + ' min') + '</span></div>' +
        originWalkStep(c) +
        journeyStep('Subís', 'board', '', { label: c.originStop.address || c.originStop.name, stop: c.originStop }, 'Sale a las ' + fmtClockTime(c.originTime)) +
        journeyStep('Bajás', 'alight', '', { label: c.destStop.address || c.destStop.name, stop: c.destStop }, (hasDestWalk ? 'Baja ~' : 'Llegás ~') + fmtClockTime(c.destTime)) +
        destWalkStep(c) +
      '</div>';
    }).join('');
  }

  function twoLegCandidatesHtml(candidates) {
    var now = Date.now();
    return candidates.map(function(c) {
      var mins = Math.round((c.originTime - now) / 60000);
      var transferLabel = c.transferStop ? (c.transferStop.address || c.transferStop.name) : 'la parada de trasbordo';
      var hasDestWalk = c.destWalkMeters >= 30;
      var transferWalkStep = '';
      if (c.walkMeters > 0 && c.boardStop) {
        transferWalkStep = journeyStep('Caminás', 'walk', '', { label: c.boardStop.address || c.boardStop.name, stop: c.boardStop }, '~' + c.walkMeters + ' m (unos ' + walkMins(c.walkMeters) + ' min)');
      }
      return '<div class="arrival convenient">' +
        '<div class="journey-head"><span class="step-route">' + escapeHtml(c.leg1Route) + ' · con transbordo</span><span class="journey-when">' + (mins <= 0 ? 'Ahora' : mins + ' min') + '</span></div>' +
        originWalkStep(c) +
        journeyStep('Subís', 'board', c.leg1Headsign, { label: c.originStop.address || c.originStop.name, stop: c.originStop }, 'Sale a las ' + fmtClockTime(c.originTime)) +
        journeyStep('Bajás', 'alight', '', { label: transferLabel, stop: c.transferStop }, 'Llegás ~' + fmtClockTime(c.transferArrival)) +
        transferWalkStep +
        journeyStep('Subís', 'board', c.leg2Route + ' · ' + c.leg2Headsign, null, 'Sale ~' + fmtClockTime(c.transferBoard)) +
        journeyStep('Bajás', 'alight', '', { label: c.destStop.address || c.destStop.name, stop: c.destStop }, (hasDestWalk ? 'Baja ~' : 'Llegás ~') + fmtClockTime(c.destTime)) +
        destWalkStep(c) +
      '</div>';
    }).join('');
  }

  function fetchRoute(fromLat, fromLon, toLat, toLon) {
    var url = API_BASE + 'route.json?fromLat=' + fromLat + '&fromLon=' + fromLon + '&toLat=' + toLat + '&toLon=' + toLon;
    return fetch(url).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(body) {
      if (body.code !== 200) throw new Error(body.text || ('código ' + body.code));
      return body.data;
    });
  }

  function mapsDirUrl() {
    if (!state.origin || !state.dest) return '#';
    return 'https://www.google.com/maps/dir/?api=1&origin=' + state.origin.lat + ',' + state.origin.lon +
      '&destination=' + state.dest.lat + ',' + state.dest.lon + '&travelmode=transit';
  }

  function renderResults(data) {
    var el = document.getElementById('resultsArea');
    var mapsLink = '<div class="btn-row"><a class="btn btn-outline btn-full" style="text-align:center;text-decoration:none;" href="' + mapsDirUrl() + '" target="_blank" rel="noopener">Ver ruta completa en Google Maps</a></div>';
    if (data.direct && data.direct.length) {
      el.innerHTML = '<div class="section-title">Mejores opciones</div><div class="transit-result">' + candidatesHtml(data.direct) + '</div>' + mapsLink;
      return;
    }
    if (data.transfer && data.transfer.length) {
      el.innerHTML = '<div class="section-title">Combinaciones con transbordo</div><div class="transit-result">' + twoLegCandidatesHtml(data.transfer) + '</div>' + mapsLink;
      return;
    }
    var fb = data.fallback || {};
    var html = '<div class="section-title">Cerca de donde salís</div>' +
      '<div class="card">' + (fb.originStop ? stopLocationHtml(fb.originStop) + arrivalsHtml(fb.originArrivals || []) : '<p style="font-size:13px;color:var(--muted);">No se encontraron paradas cercanas.</p>') + '</div>' +
      '<p style="font-size:12px;color:var(--muted);margin:4px 0 12px;">No encontramos ni una línea directa ni una combinación con transbordo entre las paradas cercanas.</p>' +
      '<div class="section-title">Cerca de a dónde vas</div>' +
      '<div class="card">' + (fb.destStop ? stopLocationHtml(fb.destStop) : '<p style="font-size:13px;color:var(--muted);">No se encontró una parada cercana.</p>') + '</div>' +
      mapsLink;
    el.innerHTML = html;
  }

  function fetchGeocode(q) {
    var url = API_BASE + 'geocode.json?q=' + encodeURIComponent(q);
    return fetch(url).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(body) {
      if (body.code !== 200) throw new Error(body.text || ('código ' + body.code));
      return body.data;
    });
  }

  function fetchReverseGeocode(lat, lon) {
    var url = API_BASE + 'reverse.json?lat=' + lat + '&lon=' + lon;
    return fetch(url).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(body) {
      if (body.code !== 200) throw new Error(body.text || ('código ' + body.code));
      return body.data && body.data.label;
    });
  }

  // ---------- Mapa persistente (Leaflet + tiles de Esri, sin API key) ----------
  // El basemap "bonito" anterior (CARTO Voyager/Dark Matter) dejó de ofrecer tiles
  // anónimas gratis y ahora devuelve un watermark de "API KEY REQUIRED" en su lugar.
  // El basemap "Canvas" gris minimalista de Esri sigue siendo gratuito sin
  // registrarse y tiene una variante oscura real (no un filtro CSS inventado).
  // Ojo: su detalle nativo llega hasta zoom 16; más cerca, Leaflet agranda esa
  // última tile (maxNativeZoom) en vez de pedir una que no existe.
  var TILE_ATTRIBUTION = 'Tiles &copy; <a href="https://www.esri.com">Esri</a> — Esri, HERE, Garmin, ' +
    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, GIS User Community';
  function tileUrl() {
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var style = dark ? 'World_Dark_Gray_Base' : 'World_Light_Gray_Base';
    return 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/' + style + '/MapServer/tile/{z}/{y}/{x}';
  }

  function pinIcon(color) {
    return L.divIcon({
      className: '',
      html: '<div style="width:24px;height:24px;border-radius:50% 50% 50% 0;background:' + color +
        ';border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.4);transform:rotate(-45deg);"></div>',
      iconSize: [24, 24],
      iconAnchor: [12, 24]
    });
  }

  var leafletMap = L.map('mapContainer', { zoomControl: false }).setView([-32.89, -68.84], 13);
  L.tileLayer(tileUrl(), { maxZoom: 19, maxNativeZoom: 16, attribution: TILE_ATTRIBUTION }).addTo(leafletMap);
  L.control.zoom({ position: 'bottomright' }).addTo(leafletMap);

  var originMarker = null;
  var destMarker = null;
  var myLocationMarker = null;
  var geoWatchId = null;
  var armedTarget = null; // 'origin' | 'dest' | null
  var popoverTarget = null;

  function startLiveLocation() {
    if (!navigator.geolocation) return;
    geoWatchId = navigator.geolocation.watchPosition(function(pos) {
      var lat = pos.coords.latitude, lon = pos.coords.longitude;
      if (myLocationMarker) { myLocationMarker.setLatLng([lat, lon]); }
      else {
        myLocationMarker = L.marker([lat, lon], {
          icon: L.divIcon({ className: 'my-location-dot', html: '', iconSize: [16, 16], iconAnchor: [8, 8] }),
          zIndexOffset: 1000,
          interactive: false
        }).addTo(leafletMap);
      }
    }, function() { /* sin permiso o sin señal: seguimos sin el puntito */ }, {
      enableHighAccuracy: true, maximumAge: 5000, timeout: 10000
    });
  }
  startLiveLocation();

  function defaultCoordLabel(coords) { return coords.lat.toFixed(5) + ', ' + coords.lon.toFixed(5); }

  function setChipText(target, text, filled) {
    var chip = document.getElementById(target === 'origin' ? 'originChip' : 'destChip');
    var textEl = document.getElementById(target === 'origin' ? 'originChipText' : 'destChipText');
    textEl.textContent = text;
    chip.classList.toggle('filled', !!filled);
  }

  function placeMarker(target, coords) {
    if (target === 'origin') {
      if (originMarker) originMarker.setLatLng([coords.lat, coords.lon]);
      else originMarker = L.marker([coords.lat, coords.lon], { icon: pinIcon('#1f9d55') }).addTo(leafletMap);
    } else {
      if (destMarker) destMarker.setLatLng([coords.lat, coords.lon]);
      else destMarker = L.marker([coords.lat, coords.lon], { icon: pinIcon('#d92d20') }).addTo(leafletMap);
    }
  }

  function fitMapToPoints() {
    if (state.origin && state.dest) {
      leafletMap.fitBounds(L.latLngBounds([
        [state.origin.lat, state.origin.lon],
        [state.dest.lat, state.dest.lon]
      ]), { paddingTopLeft: [30, 170], paddingBottomRight: [30, 260] });
    } else if (state.origin) {
      leafletMap.setView([state.origin.lat, state.origin.lon], 15);
    } else if (state.dest) {
      leafletMap.setView([state.dest.lat, state.dest.lon], 15);
    }
  }

  function armTarget(target) {
    armedTarget = target;
    document.getElementById('originChip').classList.toggle('armed', target === 'origin');
    document.getElementById('destChip').classList.toggle('armed', target === 'dest');
    var hint = document.getElementById('mapInstruction');
    if (target === 'origin') hint.textContent = 'Tocá el mapa para marcar tu punto de partida.';
    else if (target === 'dest') hint.textContent = 'Ahora tocá el mapa para marcar tu destino.';
    else hint.textContent = (state.origin && state.dest)
      ? 'Tocá "Buscar viaje", o un botón de arriba para cambiar un punto.'
      : 'Tocá un botón de arriba, o directamente el mapa, para elegir tus puntos.';
  }

  function updateSearchEnabled() {
    document.getElementById('searchBtn').disabled = !(state.origin && state.dest);
  }

  function onPointSet(justSet) {
    if (justSet === 'origin') armTarget(state.dest ? null : 'dest');
    else armTarget(state.origin ? null : 'origin');
    fitMapToPoints();
  }

  function setOrigin(coords, label) {
    state.origin = coords;
    setChipText('origin', label || defaultCoordLabel(coords), true);
    placeMarker('origin', coords);
    updateSearchEnabled();
    onPointSet('origin');
  }
  function setDest(coords, label) {
    state.dest = coords;
    setChipText('dest', label || defaultCoordLabel(coords), true);
    placeMarker('dest', coords);
    updateSearchEnabled();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ lat: coords.lat, lon: coords.lon })); } catch (e) {}
    onPointSet('dest');
  }

  function pickPointFromMap(target, lat, lon) {
    var coords = { lat: lat, lon: lon };
    if (target === 'origin') setOrigin(coords, 'Buscando la dirección...');
    else setDest(coords, 'Buscando la dirección...');
    fetchReverseGeocode(lat, lon).then(function(label) {
      setChipText(target, label || defaultCoordLabel(coords), true);
    }).catch(function() {
      setChipText(target, defaultCoordLabel(coords), true);
    });
  }

  leafletMap.on('click', function(e) {
    if (!armedTarget) return;
    pickPointFromMap(armedTarget, e.latlng.lat, e.latlng.lng);
  });

  // ---------- Popover: buscar dirección / pegar coordenadas / usar mi ubicación ----------
  function openPopover(target) {
    armTarget(target);
    popoverTarget = target;
    document.getElementById('popoverTitle').textContent = target === 'origin' ? 'Tu punto de partida' : 'Tu destino';
    document.getElementById('useMyLocation').hidden = (target !== 'origin');
    document.getElementById('popoverSearchLabel').textContent = target === 'origin' ? 'Buscá tu dirección de partida' : 'Buscá la dirección de destino';
    document.getElementById('pointSearch').value = '';
    document.getElementById('pointSuggest').hidden = true;
    document.getElementById('pointSuggest').innerHTML = '';
    document.getElementById('pointCoordsField').hidden = true;
    document.getElementById('pointPaste').value = '';
    document.getElementById('pickerPopover').hidden = false;
  }
  function closePopover() {
    document.getElementById('pickerPopover').hidden = true;
  }

  document.getElementById('originChip').addEventListener('click', function() { openPopover('origin'); });
  document.getElementById('destChip').addEventListener('click', function() { openPopover('dest'); });
  document.getElementById('popoverClose').addEventListener('click', closePopover);

  document.getElementById('useMyLocation').addEventListener('click', function() {
    var btn = this;
    btn.disabled = true;
    btn.textContent = 'Ubicándote...';
    getCurrentPosition().then(function(pos) {
      setOrigin(pos, 'Tu ubicación (' + pos.lat.toFixed(5) + ', ' + pos.lon.toFixed(5) + ')');
      closePopover();
    }).catch(function(err) {
      toast('No pudimos usar tu ubicación (' + err.message + ').');
    }).then(function() {
      btn.disabled = false;
      btn.textContent = 'Usar mi ubicación';
    });
  });

  function setupAddressSearch(inputId, suggestId, onPick) {
    var input = document.getElementById(inputId);
    var suggestBox = document.getElementById(suggestId);
    var timer = null;
    var requestId = 0;

    input.addEventListener('input', function() {
      var q = input.value.trim();
      if (timer) clearTimeout(timer);
      if (q.length < 3) { suggestBox.hidden = true; suggestBox.innerHTML = ''; return; }
      timer = setTimeout(function() {
        var myId = ++requestId;
        suggestBox.hidden = false;
        suggestBox.innerHTML = '<div class="suggest-loading">Buscando...</div>';
        var query = /mendoza/i.test(q) ? q : (q + ', Mendoza, Argentina');
        fetchGeocode(query).then(function(results) {
          if (myId !== requestId) return;
          if (!results.length) {
            suggestBox.innerHTML = '<div class="suggest-loading">Sin resultados. Probá con más detalle, o pegá coordenadas.</div>';
            return;
          }
          suggestBox.innerHTML = results.map(function(r, i) {
            return '<button type="button" data-i="' + i + '">' + escapeHtml(r.label) + '</button>';
          }).join('');
          Array.prototype.forEach.call(suggestBox.querySelectorAll('button'), function(btn) {
            btn.addEventListener('click', function() {
              var r = results[parseInt(btn.getAttribute('data-i'), 10)];
              input.value = r.label;
              suggestBox.hidden = true;
              onPick({ lat: r.lat, lon: r.lon }, r.label);
            });
          });
        }).catch(function(err) {
          if (myId !== requestId) return;
          suggestBox.innerHTML = '<div class="suggest-loading">No se pudo buscar (' + escapeHtml(err.message) + ').</div>';
        });
      }, 450);
    });

    document.addEventListener('click', function(e) {
      if (e.target !== input && !suggestBox.contains(e.target)) suggestBox.hidden = true;
    });
  }

  setupAddressSearch('pointSearch', 'pointSuggest', function(coords, label) {
    if (popoverTarget === 'origin') setOrigin(coords, label);
    else setDest(coords, label);
    closePopover();
  });

  document.getElementById('pointToggleCoords').addEventListener('click', function() {
    var f = document.getElementById('pointCoordsField');
    f.hidden = !f.hidden;
  });
  document.getElementById('pointPaste').addEventListener('input', function(e) {
    var parsed = parseMapsCoords(e.target.value);
    if (!parsed) return;
    var label = 'Coordenadas pegadas (' + parsed.lat.toFixed(5) + ', ' + parsed.lon.toFixed(5) + ')';
    if (popoverTarget === 'origin') setOrigin(parsed, label);
    else setDest(parsed, label);
    closePopover();
  });

  document.getElementById('searchBtn').addEventListener('click', function() {
    if (!state.origin || !state.dest) return;
    var btn = document.getElementById('searchBtn');
    btn.disabled = true;
    btn.textContent = 'Buscando...';
    var el = document.getElementById('resultsArea');
    el.innerHTML = '<p class="transit-loading">Buscando las mejores opciones...</p>';
    fetchRoute(state.origin.lat, state.origin.lon, state.dest.lat, state.dest.lon)
      .then(function(data) {
        renderResults(data);
      })
      .catch(function(err) {
        el.innerHTML = '<p class="transit-loading">No pudimos calcular la ruta (' + escapeHtml(err.message) + ').</p>';
      })
      .then(function() {
        btn.disabled = false;
        btn.textContent = 'Buscar viaje';
      });
  });

  armTarget('origin');
  document.getElementById('resultsArea').innerHTML = '<p class="empty-hint">Datos en vivo de Mendotran (OneBusAway). Esta página no reemplaza a la app oficial.</p>';

  // Permite que otras apps abran TransportArte con el viaje precargado:
  // ?fromLat=&fromLon=&toLat=&toLon=
  (function initFromQuery() {
    var params = new URLSearchParams(location.search);
    var fromLat = parseFloat(params.get('fromLat'));
    var fromLon = parseFloat(params.get('fromLon'));
    var toLat = parseFloat(params.get('toLat'));
    var toLon = parseFloat(params.get('toLon'));
    var hasOrigin = !Number.isNaN(fromLat) && !Number.isNaN(fromLon);
    var hasDest = !Number.isNaN(toLat) && !Number.isNaN(toLon);
    if (hasOrigin) setOrigin({ lat: fromLat, lon: fromLon }, 'Recibido');
    if (hasDest) setDest({ lat: toLat, lon: toLon }, 'Recibido');
    if (hasOrigin && hasDest) {
      setTimeout(function() { document.getElementById('searchBtn').click(); }, 50);
    }
  })();
})();
</script>
</body>
</html>
